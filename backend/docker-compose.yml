version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trackme-postgis
    environment:
      POSTGRES_DB: trackme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackme"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: trackme-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackme-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/trackme
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: 180
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackme-worker
    command: ./docker/worker-entrypoint.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/trackme
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: 180
      RATE_LIMIT_WINDOW_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pg_data:
